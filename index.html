<script type="module">
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "uAJHpxPhOs8tGoih7TQXEbbpOYW7mnWsLUtNRcuG",
            authDomain: "horaesp32.firebaseapp.com",
            databaseURL: "https://horaesp32-404f2-default-rtdb.firebaseio.com/",
            projectId: "horaesp32",
            storageBucket: "horaesp32.appspot.com",
            messagingSenderId: "xxxx",
            appId: "xxxx"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // 1. Seleciona o corpo da tabela pelo ID "leituras"
        const tbody = document.getElementById("leituras");

        // 2. Escuta os dados do nó "leituras" no Firebase
        db.ref("leituras").limitToLast(10).on("value", (snapshot) => {
            // Limpa o conteúdo atual da tabela
            tbody.innerHTML = "";

            // Se não houver dados cadastrados
            if (!snapshot.exists()) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="loading-text">Nenhum registro encontrado.</td>
                    </tr>
                `;
                return;
            }

            // 3. Percorre cada item/registro dentro de "leituras"
            snapshot.forEach((childSnapshot) => {
                const dado = childSnapshot.val();

                // Separa a string do banco pelo caractere "|" e remove espaços das pontas
                const partes = typeof dado === "string" ? dado.split("|").map(item => item.trim()) : [];

                const hora = partes[0] || '-';
                const latitude = partes[1] || '-';
                const longitude = partes[2] || '-';
                const peso = partes[3] || '-';

                // Cria o elemento da linha <tr>
                const tr = document.createElement("tr");

                // Preenche as células <td> com os dados lidos
                tr.innerHTML = `
                    <td>${hora}</td>
                    <td>${latitude}</td>
                    <td>${longitude}</td>
                    <td>${peso}</td>
                `;

                tbody.prepend(tr); // Adiciona no topo (início) da tabela
            });
        });
    </script>
