<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento de Animais - Histórico</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; color: #333; }
        h1 { color: #2c3e50; }
        .info { margin-bottom: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f6f7; color: #34495e; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <h1>Monitoramento de Animais - Realtime</h1>
    <div class="info">Histórico do Animal: id_animal_001</div>
    <div class="info" style="font-weight: normal;">Última atualização do banco: <span id="txtUltimoHorario">Carregando...</span></div>

    <table>
        <thead>
            <tr>
                <th>Data / Hora</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Peso (kg)</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <tr>
                <td colspan="4">Conectando ao Firebase...</td>
            </tr>
        </tbody>
    </table>

    <script type="module">
        // Importação dos módulos do Firebase SDK v10+
        import { initializeApp } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js";

        // Configuração do seu Firebase
        const firebaseConfig = {
            databaseURL: "https://horaesp32-404f2-default-rtdb.firebaseio.com"
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. Monitora o 'ultimo_horario' na raiz do banco
        onValue(ref(db, 'ultimo_horario'), (snapshot) => {
            document.getElementById("txtUltimoHorario").innerText = snapshot.val() || "Sem registros";
        });

        // 2. Monitora e renderiza todo o histórico de 'leituras'
        onValue(ref(db, 'leituras'), (snapshot) => {
            const leituras = snapshot.val();
            const corpoTabela = document.getElementById("tabela-corpo");
            
            // Limpa a tabela antes de renderizar os novos dados em tempo real
            corpoTabela.innerHTML = "";

            if (!leituras) {
                corpoTabela.innerHTML = "<tr><td colspan='4'>Nenhum registro encontrado.</td></tr>";
                return;
            }

            // Extrai as listas de valores mantendo a ordem de inserção do banco
            const horas = leituras.hora ? Object.values(leituras.hora) : [];
            const latitudes = leituras.latitude ? Object.values(leituras.latitude) : [];
            const longitudes = leituras.longitude ? Object.values(leituras.longitude) : [];
            const pesos = leituras.peso ? Object.values(leituras.peso) : [];

            // Identifica qual nó tem o maior número de registros para evitar que faltem linhas
            const totalRegistros = Math.max(horas.length, latitudes.length, longitudes.length, pesos.length);

            if (totalRegistros === 0) {
                corpoTabela.innerHTML = "<tr><td colspan='4'>Nenhum dado sob os nós de leitura.</td></tr>";
                return;
            }

            // Constrói as linhas da tabela combinando os índices correspondentes
            for (let i = 0; i < totalRegistros; i++) {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${horas[i] || "---"}</td>
                    <td>${latitudes[i] || "---"}</td>
                    <td>${longitudes[i] || "---"}</td>
                    <td>${pesos[i] !== undefined ? pesos[i] + " kg" : "---"}</td>
                `;

                // Insere no topo da tabela para mostrar os registros mais recentes primeiro
                corpoTabela.insertBefore(tr, corpoTabela.firstChild);
            }
        });
    </script>
</body>
</html>
