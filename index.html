<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leituras ESP32 - Painel de Monitoramento</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* Estilização Geral e Cores Globais */
        :root {
            --bg-body: #f4f6f9;
            --bg-card: #ffffff;
            --primary: #2c3e50;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border-color: #e9ecef;
            --accent: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        /* Container do Painel */
        .dashboard-container {
            width: 100%;
            max-width: 1000px;
            background-color: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
            margin-top: 20px;
        }

        /* Cabeçalho */
        h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.6rem;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background-color: var(--accent);
            border-radius: 4px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* Wrapper da Tabela para Rolagem Responsiva */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* Estilização Avançada da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: var(--bg-card);
        }

        th {
            background-color: #fafbfc;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: #4a5568;
        }

        /* Efeitos visuais para linhas de dados */
        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .loading-text {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2>Últimas Leituras do ESP32</h2>
        <p>Coordenadas e timestamp sincronizados em tempo real com o banco de dados.</p>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Data / Hora</th>
                        <th>Latitude</th>
                        <th>Longitude</th>
                        <th>Peso (kg)</th>
                    </tr>
                </thead>
                <tbody id="leituras">
                    <tr>
                        <td colspan="4" class="loading-text">Conectando ao Firebase e carregando histórico...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

 <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "uAJHpxPhOs8tGoih7TQXEbbpOYW7mnWsLUtNRcuG",
            authDomain: "horaesp32.firebaseapp.com",
            databaseURL: "https://horaesp32-404f2-default-rtdb.firebaseio.com/",
            projectId: "horaesp32",
            storageBucket: "horaesp32.appspot.com",
            messagingSenderId: "xxxx",
            appId: "xxxx"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tbody = document.getElementById("leituras");

        // Escuta as alterações no nó "leituras" em tempo real
        db.ref("leituras").on("value", (snapshot) => {
            tbody.innerHTML = "";

            if (!snapshot.exists()) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="loading-text">Nenhum registro encontrado no banco de dados.</td>
                    </tr>
                `;
                return;
            }

            const dados = snapshot.val();

            // Extrai as listas de valores de cada sub-nó em ordem
            const horas = dados.hora ? Object.values(dados.hora) : [];
            const lats = dados.latitude ? Object.values(dados.latitude) : [];
            const longs = dados.longitude ? Object.values(dados.longitude) : [];
            const pesos = dados.peso ? Object.values(dados.peso) : [];

            // Identifica o total de linhas com base no nó com mais dados
            const total = Math.max(horas.length, lats.length, longs.length, pesos.length);

            if (total === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="loading-text">Nenhum dado cadastrado.</td>
                    </tr>
                `;
                return;
            }

            // Monte a tabela combinando as posições equivalentes de cada lista
            for (let i = 0; i < total; i++) {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${horas[i] ?? '-'}</td>
                    <td>${lats[i] ?? '-'}</td>
                    <td>${longs[i] ?? '-'}</td>
                    <td>${pesos[i] ?? '-'}</td>
                `;
                
                // Adiciona no topo da tabela (mais recentes primeiro)
                tbody.prepend(tr);
            }
        });
    </script>

</body>
</html>
