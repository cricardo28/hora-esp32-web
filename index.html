<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Animais - Realtime</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            color: #333;
        }
        h1 { color: #2c3e50; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .status {
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Histórico do Animal: <span id="nome-animal">id_animal_001</span></h1>
    <div class="status" id="status-conexao">Conectando ao Firebase...</div>

    <table>
        <thead>
            <tr>
                <th>Data / Hora</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Peso (kg)</th>
            </tr>
        </thead>
        <tbody id="leituras">
            <!-- Os dados do ESP32 vão aparecer aqui dentro automaticamente -->
        </tbody>
    </table>
</div>

<!-- 1. IMPORTAÇÃO DOS MÓDULOS DO FIREBASE (V9+) -->
<script type="module">
   // import { initializeApp } from "https://gstatic.com";
    //import { getDatabase, ref, onValue } from "https://gstatic.com";

    // 2. CONFIGURAÇÃO DO SEU FIREBASE (Substitua pelos dados do seu projeto)
    const firebaseConfig = {
        apiKey: "uAJHpxPhOs8tGoih7TQXEbbpOYW7mnWsLUtNRcuG",
        authDomain: "horaesp32.firebaseapp.com",
        databaseURL: "https://horaesp32-404f2-default-rtdb.firebaseio.com/",
        projectId: "horaesp32",
        storageBucket: "horaesp32.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    /*
        apiKey: "SUA_API_KEY_DO_FIREBASE",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://firebaseio.com",
        projectId: "SEU-PROJETO",
        storageBucket: "://appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"*/
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ID do animal que você quer monitorar nesta tela
    const idAnimal = "id_animal_001"; 

    // 3. REFERÊNCIA AO CAMINHO DOS DADOS NO BANCO
    const caminhoDados = ref(db, 'leituras/hora' + idAnimal);

    // Elementos da página HTML
    const tabela = document.getElementById('leituras');
    const statusConexao = document.getElementById('status-conexao');

    // 4. ESCUTAR DADOS EM TEMPO REAL
    onValue(caminhoDados, (snapshot) => {
        statusConexao.innerText = "Conectado. Sincronizando dados em tempo real...";
        
        // Limpa a tabela antes de listar para não duplicar linhas antigas
        tabela.innerHTML = "";

        if (snapshot.exists()) {
            const dados = snapshot.val();
            
            // Transforma o objeto de registros em um array e inverte a ordem 
            // para que o dado mais recente (último enviado) apareça no topo da tabela
            const registrosOrdenados = Object.values(dados).reverse();

            registrosOrdenados.forEach((registro) => {
                // Converte o Timestamp Unix de milissegundos para uma data legível em PT-BR
                const dataFormatada = new Date(registro.timestamp).toLocaleString('pt-BR');

                // Cria uma nova linha na tabela do HTML
                const linha = `
                    <tr>
                        <td>${dataFormatada}</td>
                        <td>${registro.latitude}</td>
                        <td>${registro.longitude}</td>
                        <td>${registro.peso.toFixed(2)} kg</td>
                    </tr>
                `;
                tabela.innerHTML += linha;
            });
        } else {
            tabela.innerHTML = "<tr><td colspan='4'>Nenhum registro encontrado para este animal.</td></tr>";
        }
    }, (error) => {
        statusConexao.innerText = "Erro ao carregar dados: " + error.message;
        statusConexao.style.color = "#c0392b";
    });
</script>

</body>
</html>
